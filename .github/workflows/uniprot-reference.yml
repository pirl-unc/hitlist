name: Build UniProt reference asset

on:
  workflow_dispatch:
  push:
    branches: [feat/versioned-uniprot]
    paths:
      - scripts/build_uniprot_reference.py
      - .github/workflows/uniprot-reference.yml

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Stream and verify historical archives
        run: python scripts/build_uniprot_reference.py --output-dir "$RUNNER_TEMP/uniprot"
      - uses: actions/upload-artifact@v7
        with:
          name: uniprot-human-2015_10
          path: ${{ runner.temp }}/uniprot/
          if-no-files-found: error
          retention-days: 7
