name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,alleles]"

      - name: Lint with ruff
        run: |
          ruff check hitlist tests scripts/ci_corpus.py scripts/release_artifacts.py

      - name: Check formatting with ruff
        run: |
          ruff format --check hitlist tests scripts/ci_corpus.py scripts/release_artifacts.py

  test:
    runs-on: ubuntu-latest
    # Fail fast on a hang/OOM instead of burning the default 360-minute budget.
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    env:
      # Bump in lockstep with the corpus published by
      # scripts/publish_ci_corpus.sh (tag ci-corpus-<CORPUS_VERSION>).
      # Changing this invalidates the cache below so CI pulls the new corpus.
      CORPUS_VERSION: v2
      PYTEST_ADDOPTS: "-ra"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,alleles]"

      # ── Prebuilt observations corpus (integration tests) ──────────────
      # CI can't build the corpus (the ~15 GB IEDB/CEDAR sources aren't
      # here), so we restore the prebuilt parquets and provenance published by
      # scripts/publish_ci_corpus.sh as a public release.  Only the 3.11
      # job runs the integration suite — the other versions exist for
      # language-compat coverage, which the (non-integration) unit tests
      # already provide — so the corpus pull is gated to 3.11 to keep
      # 3.9/3.10/3.12 fast. Forks also read the canonical public release.
      # Missing or inconsistent corpus provenance must fail before tests.
      - name: Restore corpus cache
        if: matrix.python-version == '3.11'
        id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hitlist
          key: hitlist-corpus-${{ env.CORPUS_VERSION }}

      - name: Download prebuilt corpus on cache miss
        if: matrix.python-version == '3.11' && steps.corpus-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.hitlist
          gh release download "ci-corpus-${CORPUS_VERSION}" \
            --repo pirl-unc/hitlist --pattern '*.parquet' \
            --pattern observations_meta.json --dir ~/.hitlist --clobber

      - name: Verify corpus provenance and file hashes
        if: matrix.python-version == '3.11'
        run: python scripts/ci_corpus.py verify ~/.hitlist

      # Verification runs on cache hits too; only verified downloads are saved.
      - name: Save corpus cache
        if: matrix.python-version == '3.11' && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.hitlist
          key: hitlist-corpus-${{ env.CORPUS_VERSION }}

      - name: Run unit tests (with coverage)
        if: matrix.python-version == '3.11'
        run: |
          # Two passes so the memory-heavy integration tests don't OOM the
          # 16 GB runner: each loads the full ~4.4M-row observations table, and
          # the Arrow xdist fixture only shares numeric/categorical columns
          # zero-copy — string columns still materialize per worker, so 4
          # workers blow past RAM. Run non-integration with full parallelism,
          # then integration capped at 2 workers (still exercises the
          # cross-worker mmap fixture). Coverage accumulates via --cov-append.
          pytest tests/ -m "not integration" -n auto --cov=hitlist
          pytest tests/ -m integration -n 2 --cov=hitlist --cov-append --cov-report=xml

      - name: Run unit tests (no coverage)
        if: matrix.python-version != '3.11'
        run: |
          pytest tests/ -n auto

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
