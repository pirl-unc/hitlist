name: Release build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-build.yml
      - deploy.sh
      - scripts/release_artifacts.py
      - scripts/ci_corpus.py
      - scripts/publish_ci_corpus.sh
      - tests/test_ci_corpus.py
      - tests/test_deploy_script.py
      - tests/test_release_artifacts.py
      - tests/test_xdist_cache.py
      - tests/xdist_cache.py
      - test.sh
      - hitlist/curation_yaml.py
      - hitlist/supplement.py
      - tests/conftest.py
      - tests/test_bulk_proteomics.py
      - tests/test_supplement.py
      - hitlist/provenance.py
      - hitlist/builder.py
      - hitlist/detectability.py
      - hitlist/proteome.py
      - hitlist/data/bulk_proteomics/**
      - tests/test_detectability.py
      - tests/test_proteome.py
      - hitlist/assays.py
      - hitlist/canine_bulk.py
      - hitlist/canine_orfdata.py
      - hitlist/managed_assets.py
      - hitlist/data/canine_bulk.yaml
      - tests/test_canine_bulk.py
      - tests/test_canine_orfdata.py
      - tests/data/canine_orfdata/**
      - hitlist/observations.py
      - hitlist/mappings.py
      - tests/test_assays.py
      - tests/test_provenance.py
      - hitlist/cta_expression.py
      - hitlist/expression_inputs.py
      - hitlist/evidence_bundle.py
      - hitlist/tissue_blacklist.py
      - hitlist/cli_evidence.py
      - hitlist/data/tissue_blacklist.yaml
      - tests/test_cta_expression.py
      - tests/test_cta_evidence_bundle.py
      - tests/test_tissue_blacklist.py
      - hitlist/uniprot.py
      - hitlist/cli_uniprot.py
      - hitlist/data/uniprot_references.yaml
      - tests/test_uniprot.py
      - tests/test_build_uniprot_reference.py
      - scripts/build_uniprot_reference.py

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Historical serial unit phases took ~49 minutes (#636).
    # Allow both complete phases with headroom for hosted-runner variation.
    timeout-minutes: 90
    env:
      # The complete corpus needs conservative concurrency on the hosted runner.
      # Existing per-worker memory guards and both complete test phases remain.
      TEST_SH_MAX: "1"
      PYTEST_ADDOPTS: "-ra"
      CORPUS_VERSION: v3
      CORPUS_MANIFEST_SHA256: 7f7f4035d8ec080b26385710d447633dba36ac5cce49008e48e14cf8894f20d5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Verify dispatch source
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$(git branch --show-current)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tools and current development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,alleles,cta]" build twine
          # --upgrade alone retains an installed PyPI wheel with the same version.
          pip uninstall --yes datacache gtfparse serializable mhcflurry pyensembl mhcgnomes
          pip install --upgrade \
            git+https://github.com/openvax/datacache.git@master \
            git+https://github.com/openvax/gtfparse.git@master \
            git+https://github.com/openvax/serializable.git@master \
            git+https://github.com/openvax/mhcflurry.git@master \
            git+https://github.com/openvax/pyensembl.git@main \
            git+https://github.com/pirl-unc/mhcgnomes.git@main
          pip check
          python -c 'from scripts.release_artifacts import installed_dependencies; installed_dependencies()'

      - name: Require the integration corpus
        run: |
          corpus_dir=$(python scripts/ci_corpus.py install \
            --manifest-url "https://github.com/pirl-unc/hitlist/releases/download/ci-corpus-${CORPUS_VERSION}/observations_meta.json" \
            --manifest-sha256 "$CORPUS_MANIFEST_SHA256" \
            --cache-dir "$RUNNER_TEMP/hitlist-ci-corpus")
          echo "HITLIST_DATA_DIR=$corpus_dir" >> "$GITHUB_ENV"

      - name: Format, test and build the release artifacts
        run: |
          ./format.sh
          ruff check scripts/release_artifacts.py scripts/ci_corpus.py
          ruff format --check scripts/release_artifacts.py scripts/ci_corpus.py
          test -z "$(git status --porcelain --untracked-files=no)"
          /usr/bin/time -v ./deploy.sh --build-only
          twine check dist/*.whl dist/*.tar.gz
          python scripts/release_artifacts.py write dist --corpus-dir "$HITLIST_DATA_DIR"

      - uses: actions/upload-artifact@v7
        with:
          name: hitlist-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
