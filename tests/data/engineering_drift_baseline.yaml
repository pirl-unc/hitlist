# Known `engineering_drift_audit` findings in the packaged curation.
#
# Each entry is `<condition_id>|<engineering column>|<severity>`: an arm silent
# on a column that a same-material sibling asserts.  `error` means nothing else
# engineers that arm, so an expression-anchor tier really differs; `warn` means
# another column still marks it engineered and only the record is thin.
# Severity is part of the key on purpose -- a baselined `warn` that becomes an
# `error` is a real regression and must not reuse an existing entry.
#
# These are pre-existing curation debt the audit revealed, not defects it
# introduced.  pirl-unc/hitlist#593 tracks adjudicating each one, and explains
# why expression tiers are NOT demoted on silence in the meantime: that would
# key off a grouping we know is unreliable.  Each remedy is a curation
# statement someone must verify against the source, which is why they are
# recorded here rather than guessed at in bulk.
#
# tests/test_qc.py asserts the audit's findings EQUAL this file, so a new
# finding fails CI for whoever introduces it, and an entry fixed in the YAML but
# left here fails too.  Never add an entry to silence a flag.
