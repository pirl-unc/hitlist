# Known `engineering_drift_audit` findings in the packaged curation.
#
# Each entry is `<condition_id>|<engineering column>`: an arm silent on a column
# that a same-material sibling asserts.  These are pre-existing curation debt
# that the audit revealed, not defects it introduced -- pirl-unc/hitlist#593
# tracks adjudicating each one (the real value, `none` where the arm genuinely
# lacks it, or a `sample_group` that separates two materials).  Each remedy is a
# curation statement someone must verify against the source, which is why they
# are recorded here rather than guessed at in bulk.
#
# tests/test_qc.py asserts the audit's findings EQUAL this file, so a new
# finding fails CI for whoever introduces it, and an entry fixed in the YAML but
# left here fails too.  Never add an entry to silence a flag.
