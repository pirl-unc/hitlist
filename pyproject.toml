[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitlist"
dynamic = ["version"]
description = "Curated mass spectrometry evidence for MHC ligand data from IEDB and CEDAR"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "pyarrow",
    "PyYAML",
    "tqdm",
    # On-demand caching of large externalized data assets (#303) into the
    # openvax-ecosystem cache dir (datacache.get_data_dir; #291).
    "datacache",
    # Ensembl gene/transcript annotation: proteome indexing + ENSG→HGNC symbol
    # fill for line_expression. Release data is installed separately
    # (`pyensembl install --release 112 --species homo_sapiens`); the build
    # degrades gracefully when it isn't present.
    "pyensembl",
]

[project.optional-dependencies]
alleles = [
    # Pin to >=3.31.0 to match the serotype/allele normalization forms
    # the test suite asserts.  Earlier versions parsed some strings
    # differently (e.g. "SahaI*35"), which silently broke CI.
    "mhcgnomes>=3.31.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    # Pinned to a minor range: ruff enables new rules in the default set
    # on minor releases, so an unpinned spec makes ./lint.sh start
    # failing on an unchanged main whenever a developer happens to
    # upgrade.  That gate also guards ./deploy.sh, so a ruff release
    # could block a deploy with no source change.  Bump this
    # deliberately, in a PR that fixes whatever the new rules flag.
    "ruff>=0.16,<0.17",
]

[project.scripts]
hitlist = "hitlist.cli:main"

[project.urls]
Homepage = "https://github.com/pirl-unc/hitlist"
Repository = "https://github.com/pirl-unc/hitlist"

[tool.setuptools.dynamic]
version = {attr = "hitlist.version.__version__"}

[tool.setuptools.packages.find]
include = ["hitlist*"]

[tool.setuptools.package-data]
hitlist = [
    "data/*.yaml",
    "data/supplementary/*.yaml",
    "data/supplementary/*.csv",
    "data/bulk_proteomics/*.csv.gz",
    "data/bulk_proteomics/*.yaml",
    "data/line_expression/*.yaml",
    "data/line_expression/*.csv",
    "data/line_expression/*.csv.gz",
    # #347: without this glob setuptools drops peptide_attributions/ from
    # both the wheel and the sdist, so a clean install raises
    # FileNotFoundError on every peptide-level call touching PMID
    # 31844290.  It is ~1.0 MB and marked ``bundled: true`` in
    # data_assets.yaml, so the omission was an oversight rather than one
    # of the deliberate size exclusions below.
    "data/peptide_attributions/*.csv",
]

# Large paper-derived data files (#303) are NOT shipped in the wheel — together
# they blew the PyPI project size quota.  They are hosted on the GitHub
# "data-assets-v1" release and fetched on demand via datacache (see
# hitlist.downloads.EXTERNAL_DATA_ASSETS).  Kept in the git tree for development;
# the matching MANIFEST.in `exclude` lines drop them from the sdist too.
[tool.setuptools.exclude-package-data]
hitlist = [
    "data/bulk_proteomics/bekker_jensen_2017_peptides.csv.gz",
    "data/bulk_proteomics/bekker_jensen_2017_protein_abundance.csv.gz",
    "data/bulk_proteomics/ccle_nusinow_2020.csv.gz",
    "data/supplementary/strazar_2023_hla2.csv",
    "data/supplementary/abelin_2019_maptac_class2.csv",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["hitlist", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "B905", "SIM108", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["hitlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -v: the verbose per-test line listing adds noise (and a little I/O) to
# every local + CI run without aiding triage — --tb=short already gives
# concise failure context.  Use `pytest -v` ad hoc when bisecting.
addopts = "--tb=short"
markers = [
    "integration: tests that exercise the built observations.parquet corpus (skipped by default in ./test.sh; included by ./test.sh --all and ./deploy.sh)",
]

[tool.coverage.run]
source = ["hitlist"]
