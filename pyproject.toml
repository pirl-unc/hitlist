[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitlist"
dynamic = ["version"]
description = "Verified, source-preserving evidence for immune and nonimmune training data"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pyarrow",
    # Imported directly by builder, export, predict and proteome — until #602
    # only transitively present via pandas' own pin, which is a dependency we
    # do not control and could narrow.  Everything we call (`np.searchsorted`,
    # `np.frombuffer`, `np.unique`, `np.empty`/`zeros`/`full`, the fixed-width
    # scalar types) has been stable since numpy 1.x, so the floor is set by our
    # supported Python baseline rather than by any feature: 1.22 predates
    # that baseline and leaves compatible current NumPy releases available.
    "numpy>=1.22",
    "PyYAML",
    "tqdm",
    # Shared downloads/registry and transactional materialization generations (#645).
    "datacache>=1.27.1",
    # Explicit shared canine protein/reference acquisition; imports stay lazy.
    # Native peptide evidence needs ORFdata 0.40+, whose Python floor is 3.11.
    # Keep existing providers installable on Hitlist's supported Python 3.10.
    "orfdata>=0.40.0; python_version >= '3.11'",
    "orfdata>=0.10.0; python_version < '3.11'",
    "packaging>=21",
    "filelock>=3.13",
    # Ensembl gene/transcript annotation: proteome indexing + ENSG→HGNC symbol
    # fill for line_expression. Release data is installed separately
    # (`pyensembl install --release 112 --species homo_sapiens`); the build
    # degrades gracefully when it isn't present.
    "pyensembl",
    # Core curation imports mhcgnomes unconditionally (#504).
    # Pin to >=3.31.0 to match the serotype/allele normalization forms
    # the test suite asserts.  Earlier versions parsed some strings
    # differently (e.g. "SahaI*35"), which silently broke CI.
    # >=3.39.0: needs Species.compatible_with and species_source, and the
    # species-inference fixes (mhcgnomes #102/#105/#106/#107).  An older
    # floor let CI install a newer mhcgnomes than a developer had locally,
    # which is how a green local run shipped a red CI.
    # 3.54.0 added HLA-Cw16 to the serotype table (mhcgnomes#153; the tag
    # points at exactly that commit, and 3.53.0's serotypes.yaml has no Cw16).
    # The suite already required it: test_curation asserts
    # allele_to_all_serotypes("HLA-C*16:01") == ("HLA-Cw16",), which fails on
    # 3.41-3.53. So the floor was de facto 3.54.0 and only pyproject
    # disagreed; this makes the declared floor match the tested one.
    # 3.64.4 preserves chain mutation selectors in complete pairs (#528).
    # 3.64.6 catalogs source-backed, gene-specific non-roster alleles (#606).
    "mhcgnomes>=3.64.6",
    # Canonical bundled CTA panel; imported only when a gene set is queried.
    "oncoref>=1.8.207",
]

[project.optional-dependencies]
# Backward-compatible alias: the canonical CTA panel is installed by default.
cta = []
# Backward-compatible alias: allele parsing is now installed by default.
alleles = []
curation = ["openpyxl>=3.1.5"]
dev = [
    "openpyxl>=3.1.5",
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    # Pinned to a minor range: ruff enables new rules in the default set
    # on minor releases, so an unpinned spec makes ./lint.sh start
    # failing on an unchanged main whenever a developer happens to
    # upgrade.  That gate also guards ./deploy.sh, so a ruff release
    # could block a deploy with no source change.  Bump this
    # deliberately, in a PR that fixes whatever the new rules flag.
    "ruff>=0.16,<0.17",
]

[project.scripts]
hitlist = "hitlist.cli:main"

[project.urls]
Homepage = "https://github.com/pirl-unc/hitlist"
Repository = "https://github.com/pirl-unc/hitlist"

[tool.setuptools.dynamic]
version = {attr = "hitlist.version.__version__"}

[tool.setuptools.packages.find]
include = ["hitlist*"]

[tool.setuptools.package-data]
hitlist = [
    "data/*.yaml",
    "data/evidence_revisions/*.yaml",
    "data/evidence_revisions/*.json",
    "data/supplementary/*.yaml",
    "data/supplementary/*.csv",
    "data/bulk_proteomics/*.csv.gz",
    "data/bulk_proteomics/*.yaml",
    "data/line_expression/*.yaml",
    "data/line_expression/*.csv",
    "data/line_expression/*.csv.gz",
    # #347: without this glob setuptools drops peptide_attributions/ from
    # both the wheel and the sdist, so a clean install raises
    # FileNotFoundError on every peptide-level call touching PMID
    # 31844290.  It is ~1.0 MB and marked ``bundled: true`` in
    # data_assets.yaml, so the omission was an oversight rather than one
    # of the deliberate size exclusions below.
    "data/peptide_attributions/*.csv",
]

# Large paper-derived data files (#303) are NOT shipped in the wheel — together
# they blew the PyPI project size quota.  They are hosted on the GitHub
# "data-assets-v1" release and fetched on demand via datacache (see
# hitlist.downloads.EXTERNAL_DATA_ASSETS).  Kept in the git tree for development;
# the matching MANIFEST.in `exclude` lines drop them from the sdist too.
[tool.setuptools.exclude-package-data]
hitlist = [
    "data/bulk_proteomics/bekker_jensen_2017_peptides.csv.gz",
    "data/bulk_proteomics/bekker_jensen_2017_protein_abundance.csv.gz",
    "data/bulk_proteomics/ccle_nusinow_2020.csv.gz",
    "data/supplementary/strazar_2023_hla2.csv",
    "data/supplementary/abelin_2019_maptac_class2.csv",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["hitlist", "tests"]
# The one list of files ./lint.sh, ./format.sh and CI check; they pass no paths.
include = [
    "hitlist/**/*.py",
    "tests/**/*.py",
    "scripts/ci_corpus.py",
    "scripts/species_context_inventory.py",
    "scripts/allele_candidate_audit.py",
    "scripts/release_artifacts.py",
    "scripts/check_dev_install.py",
    "scripts/build_uniprot_reference.py",
    "scripts/benchmark_provenance.py",
    "scripts/qualify_corpus.py",
    "scripts/compare_corpus_generations.py",
    "scripts/qualification_modal.py",
    "scripts/qualification_transport.py",
    "scripts/qualify_human_cohort.py",
    "scripts/recover_human_cohort.py",
    "scripts/human_cohort_modal.py",
    "scripts/ingest_bekker_jensen_2017.py",
    "scripts/audit_bulk_fractionation.py",
    "scripts/audit_bulk_replicates.py",
    "scripts/audit_atlas_lineage.py",
    "scripts/audit_atlas_lineage_v2.py",
    "scripts/audit_atlas_crosswalk.py",
    "scripts/audit_tcell_availability.py",
    "scripts/verify_atlas_lineage.py",
    "scripts/verify_atlas_crosswalk.py",
    "scripts/publish_atlas_lineage.py",
    "scripts/verify_bulk_replicates.py",
    "scripts/publish_bulk_replicates.py",
    "scripts/verify_bulk_fractionation.py",
    "scripts/verify_mapp_controlled_contrast.py",
    "scripts/verify_digestion_roundtrip.py",
    "scripts/verify_digestion_arithmetic.py",
    "scripts/verify_digestion_timecourses.py",
    "scripts/verify_binding_assay_context.py",
    "scripts/verify_gomez_source_lineage.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "B905", "SIM108", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["hitlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -v: the verbose per-test line listing adds noise (and a little I/O) to
# every local + CI run without aiding triage — --tb=short already gives
# concise failure context.  Use `pytest -v` ad hoc when bisecting.
addopts = "--tb=short"
markers = [
    "integration: tests that exercise the built observations.parquet corpus (skipped by default in ./test.sh; included by ./test.sh --all and ./deploy.sh)",
]

[tool.coverage.run]
source = ["hitlist"]
