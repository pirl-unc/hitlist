# Replaces the 12 legacy per-paper ``hitlist/*_qualification.py`` modules with one
# validated YAML ledger loaded by ``hitlist/study_qualifications.py``.  Static study
# contracts, embargo/license status, and pinned checksums live here (and in the
# referenced JSON/YAML files under ``hitlist/data/``) rather than in bespoke Python
# modules.

