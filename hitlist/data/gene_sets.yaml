# Named gene sets for hitlist (e.g. `pmhc --gene-set CTA`).
#
# Each set either lists `genes:` statically (current HGNC symbols) OR names a
# `provider:` that computes the membership from another package (single source
# of truth).  The resolver (hitlist.genes.load_gene_set) expands the name into a
# symbol list, which then flows through the normal --gene path (HGNC aliases /
# Ensembl IDs still resolve).  Symbols absent from the corpus contribute zero rows.

gene_sets:
  # Cancer-testis antigens — germline/reproductive-restricted genes re-expressed
  # in cancer.  NOT hand-maintained here: sourced from the `cancerdata` package,
  # which holds the authoritative candidate list (CTpedia + daSilva2017; ~359
  # genes) and applies the HPA reproductive/thymus tissue-restriction filter
  # (protein + RNA modalities, with confidence tiers).  load_gene_set("CTA") ->
  # cancerdata.cta.CTA_gene_names() = the restriction-PASSING, expressed panel
  # (~263 genes).  cancerdata is an optional dependency (not yet on PyPI; install
  # from git — see the error message in genes._genes_from_provider).
  #
  # To change the filtering (candidates, restriction thresholds, manual
  # overrides), edit `cancerdata`, not this file — that's where the
  # candidate->filter->override pipeline lives.
  CTA:
    description: >
      Cancer-testis antigens — germline-restricted genes re-expressed in cancer.
      Sourced from cancerdata (CTpedia + daSilva2017 candidates, HPA
      reproductive/thymus restriction filter).
    source: "cancerdata.cta.CTA_gene_names()"
    provider: cancerdata
