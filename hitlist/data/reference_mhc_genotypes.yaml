schema_version: 1
description: >-
  Curated reference MHC genotypes for canonical cell lines and inbred/transgenic
  animal strains. Used to recover source-backed condition-level mhc_allele_set
  bags across MS immunopeptidomics, perturbed MS, and T-cell immunogenicity
  assays (#943, #944, #947). Allele tokens follow mhcgnomes canonical syntax.

cell_lines:
  HAP1:
    species: Homo sapiens
    synonyms: [HAP1, HAP-1, eHAP]
    class_i_alleles:
      - HLA-A*02:01
      - HLA-B*40:01
      - HLA-C*03:04
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      Near-haploid human myeloid leukemia cell line (CVCL_Y019); HLA-I typing
      verified in PMID 40113210 and pmid_overrides.yaml.

  HeLa:
    species: Homo sapiens
    synonyms: [HeLa, HeLaM, HeLa-M, HeLa S3, HeLa-S3, HeLa-Kyoto]
    class_i_alleles:
      - HLA-A*68:02
      - HLA-B*15:03
      - HLA-C*12:03
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      HeLa / HeLaM (CVCL_0030) canonical endogenous HLA-I haplotype verified by
      typing in PMID 30484775 (Ilca 2018) and Cellosaurus/TRON Seq2HLA.

  JY:
    species: Homo sapiens
    synonyms: [JY, JY-LCL]
    class_i_alleles:
      - HLA-A*02:01
      - HLA-B*07:02
      - HLA-C*07:02
    class_ii_alleles:
      - HLA-DRB1*04:04
      - HLA-DRB1*13:01
      - HLA-DQA1*01:03/DQB1*06:03
      - HLA-DQA1*03:01/DQB1*03:02
      - HLA-DPA1*01:03/DPB1*02:01
      - HLA-DPA1*01:03/DPB1*04:01
    mhc_null_class_i: false
    evidence_reference: >-
      Homozygous HLA-I EBV-LCL JY (CVCL_0108); verified in PMIDs 23481700,
      25576301, 30784271 and IHWG reference typing.

  Raji:
    species: Homo sapiens
    synonyms: [Raji, RAJI]
    class_i_alleles:
      - HLA-A*03:01
      - HLA-B*15:10
      - HLA-C*03:04
      - HLA-C*04:01
    class_ii_alleles:
      - HLA-DRB1*03:01
      - HLA-DRB1*10:01
      - HLA-DQA1*01:01/DQB1*05:01
      - HLA-DQA1*05:01/DQB1*02:01
    mhc_null_class_i: false
    evidence_reference: >-
      Burkitt lymphoma B-cell line Raji (CVCL_0511); HLA-I verified in
      PMID 38480730, HLA-DR verified in PMID 23328677.

  A549:
    species: Homo sapiens
    synonyms: [A549, A-549]
    class_i_alleles:
      - HLA-A*25:01
      - HLA-A*30:01
      - HLA-B*18:01
      - HLA-B*44:03
      - HLA-C*12:03
      - HLA-C*16:01
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      Lung adenocarcinoma cell line A549 (CVCL_0023); verified in PMIDs
      30833945 and 34171305.

  HEK293T:
    species: Homo sapiens
    synonyms: [HEK293T, HEK-293T, 293T, 293-T, HEK293, HEK-293, 293, Expi293F]
    class_i_alleles:
      - HLA-A*03:01
      - HLA-B*07:02
      - HLA-C*07:02
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      HEK293/293T (CVCL_0063/CVCL_0045) homozygous HLA-A*03:01, B*07:02,
      C*07:02 verified in Cellosaurus/TRON and PMID 34171305.

  MCF-7:
    species: Homo sapiens
    synonyms: [MCF-7, MCF7, MCF-7/LY2, LY2]
    class_i_alleles:
      - HLA-A*02:01
      - HLA-B*18:01
      - HLA-B*44:02
      - HLA-C*05:01
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      Breast adenocarcinoma cell line MCF-7 (CVCL_0031); verified in
      PMID 19615748 and TRON Cell Line Portal.

  K562:
    species: Homo sapiens
    synonyms: [K562, K-562]
    class_i_alleles: []
    class_ii_alleles: []
    mhc_null_class_i: true
    evidence_reference: >-
      HLA class I/II negative erythroleukemia host line K562 (CVCL_0004).
      Never impute endogenous HLA alleles onto K562; requires explicit
      transduced allele annotation.

  721.221:
    species: Homo sapiens
    synonyms: ['721.221', '721221', B721.221, B721, LCL 721.221]
    class_i_alleles: []
    class_ii_alleles:
      - HLA-DRB1*01:01
      - HLA-DQA1*01:01/DQB1*05:01
      - HLA-DPA1*01:03/DPB1*04:01
      - HLA-DPA1*02:01/DPB1*10:01
    mhc_null_class_i: true
    evidence_reference: >-
      HLA-A/B/C-deleted EBV-LCL 721.221 (CVCL_6263); Class I null host used for
      mono-allelic panels, retains endogenous Class II.

  C1R:
    species: Homo sapiens
    synonyms: [C1R, HMy2.C1R, C1R-parental]
    class_i_alleles:
      - HLA-B*35:03
      - HLA-C*04:01
    class_ii_alleles: []
    mhc_null_class_i: false
    low_endogenous_class_i: true
    evidence_reference: >-
      HMy2.C1R (CVCL_3662) lacks HLA-A and expresses trace endogenous HLA-B*35:03
      and HLA-C*04:01 (Schittenhelm et al. PMID 24366607); commonly transduced
      with exogenous Class I alleles.

  T2:
    species: Homo sapiens
    synonyms: [T2, T2 cells, 174xCEM.T2]
    class_i_alleles:
      - HLA-A*02:01
      - HLA-B*51:01
      - HLA-C*01:02
    class_ii_alleles: []
    mhc_null_class_i: false
    tap_deficient: true
    evidence_reference: >-
      TAP1/TAP2- and Class-II-deleted lymphoblast hybrid T2 (CVCL_2211);
      endogenous HLA-A*02:01 (and B*51:01/C*01:02), widely used for exogenous
      peptide pulsing assays.

  Jurkat:
    species: Homo sapiens
    synonyms: [Jurkat, JURKAT, Jurkat E6-1, Jurkat E6.1]
    class_i_alleles:
      - HLA-A*03:01
      - HLA-B*07:02
      - HLA-B*35:03
      - HLA-C*04:01
      - HLA-C*07:02
    class_ii_alleles: []
    mhc_null_class_i: false
    evidence_reference: >-
      T-cell leukemia line Jurkat (CVCL_0065); HLA-I verified in PMID 25810538.

  GRANTA-519:
    species: Homo sapiens
    synonyms: [GRANTA-519, GRANTA 519, Granta-519, Granta519]
    class_i_alleles:
      - HLA-A*02:01
      - HLA-A*02:05
      - HLA-B*07:02
      - HLA-B*50:01
      - HLA-C*06:02
      - HLA-C*07:02
    class_ii_alleles:
      - HLA-DRB1*11:03
      - HLA-DRB1*15:01
      - HLA-DRB3*02:02
      - HLA-DRB5*01:01
    mhc_null_class_i: false
    evidence_reference: >-
      Mantle cell lymphoma line GRANTA-519 (CVCL_1818); verified in PMID 33936100.

  ECN90:
    species: Homo sapiens
    synonyms: [ECN90, EndoC-betaH1, ECN-90]
