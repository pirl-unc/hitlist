# Cell-line registry + metadata catalog for hitlist.cell_name_parser.
#
# Two jobs in one file:
#   1. NORMALIZATION — maps every observed synonym of a line to one canonical
#      name + cell-of-origin lineage, so the parser collapses "K562", "K-562",
#      "K562-Myeloid cell" onto a single entry with cell_type "Myeloblast".
#   2. CATALOG — authoritative per-line properties (Cellosaurus-verified), so
#      cell-line metadata lives in ONE place instead of being scattered across
#      IEDB strings, pmid_overrides.yaml, and monoallelic_lines.yaml.
#
# Schema per entry (key = canonical line name):
#   synonyms:    list of strings the parser recognizes as this line (case-
#                insensitive, after stripping trailing "cells"/"cell" and a
#                "-<lineage>" suffix).  Include every punctuation variant seen.
#   cell_type:   cell-of-origin LINEAGE (Cellosaurus-based). Lymphocyte lineages
#                use the hyphenated house style: "B-cell", "T-cell", "NK-cell".
#                Others: "Epithelial cell", "Melanocyte", "Myeloblast",
#                "Neuroblast", "Monocyte", "Fibroblast", "Glial cell", ...
#   tissue:      derived-from site (Cellosaurus); free text.
#   species:     "Homo sapiens", "Mus musculus", "Sarcophilus harrisii", ...
#   sex:         "Male" / "Female" / "" (unknown).
#   cvcl:        Cellosaurus accession (CVCL_xxxx), the stable cross-reference.
#   disease:     tumor / disease of origin; "" for non-malignant lines.
#   category:    Cellosaurus category ("Cancer cell line", "Transformed cell
#                line", "Finite cell line", "Spontaneously immortalized ...").
#   is_cancer:   malignant-derived line (tumor).  EBV-LCLs are NOT cancer.
#   is_ebv_lcl:  EBV-transformed B-lymphoblastoid line (a host, not a tumor).
#   notes:       provenance / caveats (Cellosaurus confidence, mislabel fixes).
#
# Extra fields are ignored by the parser (it reads synonyms + cell_type +
# tissue); they exist for downstream consumers.  Cellosaurus is the source of
# truth — when IEDB's coarse lineage suffix disagrees, the registry wins.

