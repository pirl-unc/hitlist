  (APM) genes across Homo sapiens (HGNC), Mus musculus (MGI), Rattus norvegicus
  (RGD), Macaca mulatta, Canis lupus familiaris, Bos taurus, Sus scrofa, and
  Gallus gallus (#944). Explicit absent_in_species records biologically absent
  orthologs (notably ERAP2 in rodents).

