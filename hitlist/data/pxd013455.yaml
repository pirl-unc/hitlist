limitations:
  - The original PXD004452 search FASTA remains unresolved; these are reanalysis labels.
  - Match-between-runs detections are not direct MS/MS identifications.
  - Leading-razor assignment does not independently establish every possible parent.
  - Biological specimen, donor and replicate independence are unresolved.
  - No first-seen depth labels or cross-protocol comparability are established.
  - A single cultured HeLa scope cannot establish prospective or cross-tissue detectability.
  - Search-engine output and standalone XML report different MaxQuant versions.
  - Source rows outside the chosen length, mass and digestion window do not become candidate labels.
  - Fractionation pH denotes the paper's reported buffer, not a measured gradient pH.
