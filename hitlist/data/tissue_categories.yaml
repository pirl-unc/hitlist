# IEDB Source Tissue → category mappings.
# Categories: reproductive, reproductive_female, reproductive_male,
#             resting_mammary, thymus, somatic (default if not listed).
# Tissue names are lowercased for matching.
#
# Reproductive tissue is split into three tiers by what actually makes a
# cancer-testis-antigen target safe, aligned with OncoRef anatomy (#963):
#
#   reproductive          Immune-privileged / fetally tolerized tissue
#                         (testis behind the blood-testis barrier, placenta via
#                         HLA-G fetal tolerance). CTA-safe regardless of patient
#                         sex — privilege, not sex, is the safety basis. testis
#                         lives here (NOT in reproductive_male) for that reason.
#   reproductive_female   Female-exclusive reproductive tract & lactating breast.
#                         Presents antigen normally, so a safety signal only in
#                         female patients (matches OncoRef female_sex_compartments).
#   reproductive_male     Male-exclusive reproductive tract. Presents antigen
#                         normally, so a safety signal only in male patients.
#                         Default (sex unknown) = permissive, i.e. NOT counted as
#                         a somatic safety signal (src_healthy_tissue).
#   resting_mammary       Resting breast / mammary gland. Present in BOTH adult
#                         females and adult males (matches OncoRef
#                         male_adult_protected_compartments); therefore counted
#                         as a somatic safety tissue (src_healthy_tissue=True)
#                         rather than female-only (src_healthy_reproductive_female=False).

reproductive:
  - testis
  - epididymis
  - placenta
  - embryo

reproductive_female:
  - lactating breast
  - ovary
  - uterus
  - uterine cervix
  - cervix
  - endometrium
  - fallopian tube
  - vagina

reproductive_male:
  - prostate
  - seminal vesicle

resting_mammary:
  - breast
  - mammary gland

thymus:
  - thymus

# Cell types that indicate activated APCs when source tissue is blood.
activated_apc_cell_names:
  - dendritic cell
  - macrophage

activated_apc_tissues:
  - blood

# Anatomical roll-up groups for the `pmhc --by-tissue` display (display-only,
# not classification).  Specific organs (and the umbrella label itself) collapse
# to the umbrella by DEFAULT; `--expand-tissues` keeps the organs and marks
# umbrella-LABELED rows "(region unspecified)".  Matching is case-insensitive;
# names are in the DISPLAY vocabulary (post-abbreviation, e.g. "GI tract", "CNS").
# Note: Peripheral Nervous System (PNS) is deliberately NOT under CNS.
tissue_groups:
  "GI tract":
    - Esophagus
    - Stomach
    - Small Intestine
    - Large Intestine
    - Colon
    - Duodenum
    - Jejunum
    - Ileum
    - Cecum
    - Rectum
  "CNS":
    - Brain
    - Cerebellum
    - Cerebral Cortex
    - Cerebrum
    - Spinal Cord
